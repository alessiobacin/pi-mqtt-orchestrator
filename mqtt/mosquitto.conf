# Local development broker only — meant to run INSIDE the Docker container
# started by mqtt/compose.yaml, NOT for production or Internet exposure.
# See docs/architecture.md §32-36 for the TLS/ACL/auth hardening required
# before this is ever exposed beyond loopback.
#
# IMPORTANT: this binds to 0.0.0.0 (all interfaces INSIDE the container's own
# network namespace) on purpose. Binding to 127.0.0.1 here would bind only
# the container's own loopback, which Docker's port-forwarding cannot reach
# from the host — the broker would be silently unreachable from outside the
# container (this was a real bug in an earlier version of this file: it
# caused every client, including this project's own `pi` extension, to sit
# forever "reconnecting…" with no error). The host-side restriction to
# loopback only is already enforced by mqtt/compose.yaml's port mapping
# ("127.0.0.1:1883:1883"), which is the correct place to enforce it with
# Docker.
#
# If you ever run mosquitto directly on the host instead of via Docker (not
# the supported path for this package — see docs/mvp-notes.md "Un solo
# broker"), add your own `bind_address 127.0.0.1` to keep the same
# loopback-only guarantee, since Docker's port mapping won't be there to
# enforce it for you in that case.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

persistence false
log_type error
log_type warning
log_type notice
